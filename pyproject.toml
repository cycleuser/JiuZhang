[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuzhang"
dynamic = ["version"]
description = "九章 - A comprehensive mathematics learning platform from basics to frontier math"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "JiuZhang Contributors"}
]
keywords = ["mathematics", "education", "visualization", "learning", "ollama", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "requests>=2.31",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "sympy>=1.12",
    "scipy>=1.10",
]

[project.optional-dependencies]
gui = [
    "pyqtgraph>=0.13",
    "PySide6>=6.5",
]
web = [
    "echarts-python>=0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
jiuzhang = "jiuzhang.cli:main"

[project.urls]
Homepage = "https://github.com/cycleuser/JiuZhang"
Documentation = "https://github.com/cycleuser/JiuZhang#readme"
Repository = "https://github.com/cycleuser/JiuZhang"
Issues = "https://github.com/cycleuser/JiuZhang/issues"

[tool.setuptools.dynamic]
version = {attr = "jiuzhang.__version__"}

[tool.setuptools.packages.find]
include = ["jiuzhang*"]

[tool.setuptools.package-data]
jiuzhang = [
    "templates/**/*.html",
    "static/**/*",
    "courses/**/*.json",
    "courses/**/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
